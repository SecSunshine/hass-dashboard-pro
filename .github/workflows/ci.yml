name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify generated dist is committed
        run: git diff --exit-code -- dist/hass-dashboard-pro.js

      - name: Verify diff whitespace
        run: git diff --check

      - name: Audit high-risk dependencies against official npm registry
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser interaction tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
